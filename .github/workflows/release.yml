# 打 tag 就出 **Windows 安装包 + Linux 离线包**，并挂到 Release 上供人下载。
#
# 为什么放 CI：这台机器上打 Windows 包要手工备 NSIS 缓存、本机还得有 Rust；
# GitHub 的 runner 三步直接跑通，而且谁都能复现同一份产物。
# （打包本身不是 GitHub 的功能 —— Windows 走 tauri CLI + NSIS，Linux 走仓库自己的
# deploy/pack-linux.mjs，两边都只是在 runner 上跑仓库里现成的脚本。）
#
# 触发：
#   · push tag（形如 v1.2.0，只是格式示例 —— 号本身永远以 apps/desktop/version.json 为准）
#     **tag 必须与 apps/desktop/version.json 相同**（版本真源唯一），
#     不一致直接失败，免得发出去的包和仓库里的号对不上；
#   · 手动（workflow_dispatch）—— 用 version.json 当 tag 名，方便补发已经打过的版本。
#
# ⚠️ 产物**没有代码签名**：下载的人会看到 Windows SmartScreen「未知发布者」。
#    要消掉得买证书（OV/EV 或 Azure Trusted Signing），再在这里加一步 signtool ——
#    在那之前，Release 正文里写明"按提示选仍要运行"，并把 SHA256SUMS 一起传上去。
#
# 结构（2026-10-25 加 Linux 包时改成三段）：
#   windows-installer / linux-package 两个 job **只打包**，产物交 upload-artifact；
#   publish job 收齐两边再一次性挂 Release —— 不能让两个 job 各自调 action-gh-release：
#   同一个 tag 的 Release 被并发 get-or-create + 改 body，会互相覆盖甚至丢资产。
#   校验和也归 publish 一次生成（一份 SHA256SUMS 盖住两个产物，用户不用对两份账）。

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 建 Release 要写权限；仓库默认的 GITHUB_TOKEN 可能是只读，所以显式声明。
permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - name: 读版本号（真源：apps/desktop/version.json）
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content apps/desktop/version.json -Raw | ConvertFrom-Json).version
          if (-not $v) { throw 'apps/desktop/version.json 里没有 version' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本：$v"

      - name: tag 与版本号必须一致
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $want = "v${{ steps.ver.outputs.version }}"
          if ('${{ github.ref_name }}' -ne $want) {
            throw "tag 是 ${{ github.ref_name }}，但 version.json 是 $want —— 版本真源唯一，先改 version.json 再打 tag。"
          }

      - name: 取 Node 运行时（安装包必须自带，不许要求用户自装）
        run: node apps/desktop/fetch-node.mjs

      - name: 摊运行时与许可文本到 runtime/
        run: node apps/desktop/stage-runtime.mjs

      - name: 出安装包
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2 build

      - name: 规范成 ASCII 资产名（GitHub 会把中文资产名吃掉，2026-10-16 实测：班底_ → _）
        shell: pwsh
        run: |
          $dir = 'apps/desktop/target/release/bundle/nsis'
          $exe = Get-ChildItem $dir -Filter '*-setup.exe' | Where-Object { $_.Name -notlike 'bandi_*' } | Select-Object -First 1
          if (-not $exe) { throw "没找到安装包：$dir" }
          $out = Join-Path $dir "bandi_${{ steps.ver.outputs.version }}_x64-setup.exe"
          Copy-Item $exe.FullName $out -Force

      - name: 交产物给 publish
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: apps/desktop/target/release/bundle/nsis/bandi_*_x64-setup.exe
          if-no-files-found: error

  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 仓库自己的脚本（deploy/pack-linux.mjs）：下载随包 node（Linux x64，nodejs.org
      # 不通就换 npmmirror）、摊 apps/skills/plugins/deploy 进暂存、tar 出
      # dist/bandi-linux-x64-v<版本>.tar.gz。runner 上没有本机那种 tmp/ 缓存，
      # 每次都真下载 —— 这正是"谁都能复现同一份产物"要的样子。
      # ⚠️ 不传 --node：随包 node 版本跟着 setup-node 的解析走；要钉死就在下面加 --node x.y.z。
      - name: 出 Linux 离线包
        run: node deploy/pack-linux.mjs

      - name: 产物落在哪、多大（一眼确认脚本没静默空跑）
        run: ls -l dist/

      - name: 交产物给 publish
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/bandi-linux-x64-*.tar.gz
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [windows-installer, linux-package]
    steps:
      - uses: actions/checkout@v4

      - name: 读版本号（真源同上）
        id: ver
        run: |
          v=$(node -p "require('./apps/desktop/version.json').version")
          if [ -z "$v" ]; then echo 'apps/desktop/version.json 里没有 version' >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: 收两个产物
        uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          merge-multiple: true
          path: pkg

      - name: 两份都得在，然后算校验和（一份账盖住两个产物）
        shell: bash
        run: |
          set -euo pipefail
          cd pkg
          v='${{ steps.ver.outputs.version }}'
          [[ -f "bandi_${v}_x64-setup.exe" ]] || { echo "缺 Windows 安装包（bandi_${v}_x64-setup.exe）"; exit 1; }
          [[ -f "bandi-linux-x64-v${v}.tar.gz" ]] || { echo "缺 Linux 离线包（bandi-linux-x64-v${v}.tar.gz）"; exit 1; }
          sha256sum "bandi_${v}_x64-setup.exe" "bandi-linux-x64-v${v}.tar.gz" > "SHA256SUMS-v${v}.txt"
          cat "SHA256SUMS-v${v}.txt"

      - name: 清掉这个 Release 上不在名单里的旧资产
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $tag = "v$v"
          $keep = @("bandi_${v}_x64-setup.exe", "bandi-linux-x64-v$v.tar.gz", "SHA256SUMS-v$v.txt")
          try {
            $rel = Invoke-RestMethod "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" `
              -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'bandi-ci' }
          } catch { Write-Host "这个 tag 还没有 Release，跳过清理"; exit 0 }
          foreach ($a in $rel.assets) {
            if ($keep -notcontains $a.name) {
              Invoke-RestMethod -Method Delete -Uri $a.url `
                -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'bandi-ci' }
              Write-Host "删掉旧资产：$($a.name)"
            }
          }

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: 班底 ${{ steps.ver.outputs.version }}
          overwrite_files: true
          body: |
            **Windows 安装包**（自带 Node 运行时，装完即用）。

            - 下载 `bandi_${{ steps.ver.outputs.version }}_x64-setup.exe`，双击安装。
              （文件名用 ASCII 是因为 GitHub 会把中文资产名吃掉；装出来的程序仍叫「班底」。）
            - 许可：随包带 `LICENSE` / `NOTICE` / `node-LICENSE.txt`（Apache-2.0，二进制分发同样适用）。
            - 卸载时可选**完全卸载**：连数据一起删（库、令牌、插件与连接器、机器登记表、开机自启项），
              默认不删；静默卸载不删。

            **Linux 离线包**（x64，服务器用；同样自带 Node 运行时，目标机零依赖）。

            - 下载 `bandi-linux-x64-v${{ steps.ver.outputs.version }}.tar.gz`，服务器上一条命令装好：
              `tar xzf bandi-linux-x64-v*.tar.gz && cd bandi && sudo sh install.sh`
              （systemd 服务 + `bandi` 命令自动注册；没有 root 的走仓库 `deploy/README.md` 的用户态路线。）
            - 校验和见 `SHA256SUMS-v${{ steps.ver.outputs.version }}.txt`（两行：Windows 与 Linux 各一条）。

            ⚠️ 两份产物都**没有代码签名**：Windows 可能提示「未知发布者」—— 按提示选「仍要运行」；
              Linux 侧请用上面的 SHA256 核对下载完整性。
          files: |
            pkg/bandi_*_x64-setup.exe
            pkg/bandi-linux-x64-*.tar.gz
            pkg/SHA256SUMS-*.txt
