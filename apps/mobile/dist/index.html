<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>班底</title>
    <link rel="stylesheet" href="launcher.css" />
  </head>
  <body>
    <main class="wrap">
      <!--
        2026-11-05 再改版（用户定的）：上一版还是"落地页"味 —— 居中品牌 hero、
        分隔线、大段说明。这一版按原生 App 的习惯重排：
          · 品牌区 = iOS 大标题式**左对齐**一行（logo + 名字 + 一句副标题）；
          · 扫码 = 全宽**横向**主卡片（取景框在左、文案在右，像原生列表的主入口）；
          · 次要入口 = iOS inset grouped list（整组一张卡、行间 hairline）；
          · 返回按钮用原生的蓝色 chevron；说明文字一律压短。
        结构契约不动：launcher.js / scanner.js 依赖的 id 和类名原样保留。
      -->

      <!-- ============================================================ 首页 -->
      <section id="viewHome" class="view view-home">
        <header class="brand">
          <!--
            2026-11-06 品牌统一：文字「B」换成与登录页/主站同源的真 B 字标
            （双椭圆镂空，auth.mjs brandSvg / index.html 同一笔画）。渐变底不变。
          -->
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 512 512" role="img" aria-label="班底">
              <defs>
                <mask id="b-hole">
                  <rect width="512" height="512" fill="#fff" />
                  <ellipse cx="268" cy="206" rx="36" ry="29" fill="#000" />
                  <ellipse cx="274" cy="340" rx="40" ry="31" fill="#000" />
                </mask>
              </defs>
              <g mask="url(#b-hole)" fill="#fff">
                <rect x="154" y="138" width="72" height="236" rx="34" />
                <path d="M194,156 C272,142 338,168 338,208 C338,248 288,268 194,264 Z" />
                <path d="M194,282 C284,276 348,306 348,340 C348,372 288,388 194,382 Z" />
                <rect x="172" y="336" width="70" height="52" rx="26" />
              </g>
            </svg>
          </div>
          <div class="brand-txt">
            <h1>班底</h1>
            <p class="brand-sub">连上你的电脑，接着干</p>
          </div>
        </header>

        <!-- 扫码 = 全宽横向主卡片（相机与解码在 scanner.js，这里只负责开遮罩） -->
        <button id="scanBtn" class="scan-hero" type="button">
          <span class="frame" aria-hidden="true">
            <span class="frame-qr">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="6.4" height="6.4" rx="1.7" />
                <rect x="14.6" y="3" width="6.4" height="6.4" rx="1.7" />
                <rect x="3" y="14.6" width="6.4" height="6.4" rx="1.7" />
                <path d="M14.6 14.6h2.9v2.9h-2.9z" />
                <path d="M20.4 14.6v.01M20.4 21v-3.5M17.6 21h-3" />
              </svg>
            </span>
            <i></i><i></i><i></i><i></i>
            <span class="sweep"></span>
          </span>
          <span class="scan-txt">
            <span class="scan-title">扫码连接</span>
            <span class="scan-sub">对准电脑屏幕上的二维码</span>
          </span>
          <span class="scan-chev" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 5l7 7-7 7" />
            </svg>
          </span>
        </button>

        <p class="sec-label">其他方式</p>

        <!--
          两条次要入口 = 一张 grouped 卡。整行是按钮（点击区域够大），右端箭头
          表示"还有下一层"。「已配对的电脑」没有记录时整行不出现（JS 里 hidden）。
        -->
        <div class="alt">
          <button id="pairedEntry" class="alt-row" type="button" hidden>
            <span class="alt-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.6" y="3.8" width="18.8" height="12.8" rx="2.4" />
                <path d="M8.4 20.4h7.2M12 16.6v3.8" />
              </svg>
            </span>
            <span class="alt-txt">
              <span class="alt-label">已配对的电脑</span>
              <span class="alt-meta" id="pairedMeta">读取中…</span>
            </span>
            <span class="alt-chev" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 5l7 7-7 7" />
              </svg>
            </span>
          </button>

          <button id="codeEntry" class="alt-row" type="button">
            <span class="alt-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.8" y="4" width="18.4" height="16" rx="2.6" />
                <path d="M7.2 9h.01M12 9h.01M16.8 9h.01M7.2 14h.01M12 14h.01M16.8 14h.01" />
              </svg>
            </span>
            <span class="alt-txt">
              <span class="alt-label">输入邀请码</span>
              <span class="alt-meta">电脑上的 9 位数字</span>
            </span>
            <span class="alt-chev" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 5l7 7-7 7" />
              </svg>
            </span>
          </button>

          <!--
            账号密码登录（2026-11-05 用户：「把账号密码登录的入口也放到扫码页」）。
            与扫码/邀请码殊途同归：进去以后都是**设备身份**（服务端按 clientKey 落设备，
            见 routes/users.mjs 的 claimPhoneIdentity），「我的」页只有一套。
          -->
          <button id="loginEntry" class="alt-row" type="button">
            <span class="alt-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8.1" r="3.7" />
                <path d="M4.9 20.2c0-3.7 3.2-6.1 7.1-6.1s7.1 2.4 7.1 6.1" />
              </svg>
            </span>
            <span class="alt-txt">
              <span class="alt-label">账号密码登录</span>
              <span class="alt-meta">用电脑上那个账号</span>
            </span>
            <span class="alt-chev" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 5l7 7-7 7" />
              </svg>
            </span>
          </button>
        </div>
      </section>

      <!-- ============================================================ 邀请码 -->
      <section id="viewCode" class="view" hidden>
        <div class="nav">
          <button id="codeBack" class="nav-back" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" />
            </svg>
            返回
          </button>
        </div>

        <h2 class="view-title">输入邀请码</h2>
        <p class="view-sub">电脑上「设置 → 手机配对」里那串 9 位数字</p>

        <label class="lab" for="addrInput">电脑地址</label>
        <input
          id="addrInput"
          class="field"
          type="text"
          inputmode="url"
          enterkeyhint="next"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="192.168.1.5:18787"
          aria-label="电脑地址"
        />
        <label class="lab" for="codeInput">邀请码</label>
        <input
          id="codeInput"
          class="code-input"
          type="text"
          inputmode="numeric"
          enterkeyhint="go"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          maxlength="11"
          placeholder="000 000 000"
          aria-label="九位邀请码"
        />
        <button id="connectBtn" class="btn primary" type="button">连接</button>
        <p class="foot-hint">
          从电脑上复制整条配对链接、粘进地址栏，也可以。
        </p>
      </section>

      <!-- ============================================================ 账号密码 -->
      <!--
        和扫码/邀请码同一个终点：打开 `<origin>/`，没票时服务端渲染登录页。
        区别只在"怎么证明你是你"——这里是密码，那里是邀请码。登录成功后服务端照样
        发设备卡，所以进去以后「我的」页、已配对列表、断开连接全一致。
      -->
      <section id="viewLogin" class="view" hidden>
        <div class="nav">
          <button id="loginBack" class="nav-back" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" />
            </svg>
            返回
          </button>
        </div>

        <h2 class="view-title">账号密码登录</h2>
        <p class="view-sub">用电脑上那个账号登录。这台手机同时会被记成一台设备，和扫码配对一样。</p>

        <label class="lab" for="loginAddr">电脑地址</label>
        <input
          id="loginAddr"
          class="field"
          type="text"
          inputmode="url"
          enterkeyhint="go"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="192.168.1.5:18787"
          aria-label="电脑地址"
        />

        <button id="loginGo" class="btn primary" type="button">打开登录页</button>
        <p class="foot-hint" id="loginHint">
          地址在电脑上「设置 → 手机配对」里能看到。
        </p>
      </section>

      <!-- ============================================================ 已配对 -->
      <section id="viewPaired" class="view" hidden>
        <div class="nav">
          <button id="pairedBack" class="nav-back" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" />
            </svg>
            返回
          </button>
        </div>

        <h2 id="pairedTitle" class="view-title">已配对的电脑</h2>

        <div id="pairedList" class="paired"><div class="empty">读取中…</div></div>
        <p class="foot-hint" id="pairedHint">
          点一台看详情。凭据留在手机上，连接不用重新扫码。
        </p>

        <div id="pairedDetail" class="pd" hidden>
          <div class="pd-card">
            <div class="pd-name" id="pdName"></div>
            <div class="pd-host" id="pdHost"></div>
          </div>

          <dl class="pd-rows">
            <div class="pd-row">
              <dt>电脑地址</dt>
              <dd id="pdOrigin"></dd>
            </div>
            <div class="pd-row">
              <dt>最近连接</dt>
              <dd id="pdLast"></dd>
            </div>
          </dl>

          <button id="pdConnect" class="btn primary" type="button">连接</button>
          <button id="pdForget" class="btn danger" type="button">取消配对</button>
          <p class="foot-hint">
            取消配对只清这台手机上的记录，电脑端不受影响。
          </p>
        </div>
      </section>

      <!-- 状态条钉在页面底部（CSS position:fixed），不占布局位、不推输入框 -->
      <p id="status" class="status" hidden></p>
    </main>

    <!-- 扫码遮罩：铺满全屏，video 垫底，取景框和提示浮在上面（恒深色，相机画面） -->
    <div id="scan" class="scan" hidden>
      <video id="scanVideo" class="scan-video" playsinline muted autoplay></video>
      <div class="scan-top">
        <p class="scan-head">扫描二维码</p>
        <button id="scanCancel" class="scan-x" type="button" aria-label="关闭扫码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="scan-center">
        <div class="scan-guide"><i></i><i></i><i></i><i></i><span class="scan-sweep"></span></div>
        <p id="scanMsg" class="scan-msg">对准电脑上的二维码</p>
      </div>
      <p class="scan-tip">电脑上「设置 → 手机配对」</p>
    </div>

    <script src="vendor/jsQR.js"></script>
    <script src="scanner.js"></script>
    <script src="launcher.js"></script>
  </body>
</html>
