<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>班底</title>
    <link rel="stylesheet" href="launcher.css" />
  </head>
  <body>
    <main class="wrap">
      <!--
        2026-11-07 主路径改版（用户定稿）：手机端 = **账号密码登录 → 设备列表 → 点一台进去**。
          1. 首屏只有一件事：用手机号和密码登中枢（与电脑上那个账号同一套，中枢签发）。
          2. 登录后拿到「我名下的电脑」名册，点一台 → 中枢签一张一次性票 →
             打开 `<那台电脑>/hub/enter?ticket=…`，电脑验票发会话，直接进面板。
             这一路**不用再输码**：票就是进门凭据（契约 §五/§六）。
          3. 同日再拍板「撤掉扫码，hub 唯一入口」：曾经的兜底三件套（扫码 / 邀请码 /
             已配对）连同扫码遮罩、scanner.js 与 vendored jsQR 整场退场 ——
             hub 账号是唯一的身份，换机器在设备列表里切；配对子系统只在服务端
             留着给存量设备令牌兜底。

        视觉沿用 2026-11-05 定稿的原生味儿：左对齐品牌区、inset grouped 列表、
        行内 hairline、底部固定的状态条。结构契约：launcher.js 依赖的 id 不能改。
      -->

      <!-- ============================================================ 登录 -->
      <section id="viewHome" class="view view-home">
        <header class="brand">
          <!--
            2026-11-06 品牌统一：文字「B」换成与登录页/主站同源的真 B 字标
            （双椭圆镂空，auth.mjs brandSvg / index.html 同一笔画）。渐变底不变。
          -->
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 512 512" role="img" aria-label="班底">
              <defs>
                <mask id="b-hole">
                  <rect width="512" height="512" fill="#fff" />
                  <ellipse cx="268" cy="206" rx="36" ry="29" fill="#000" />
                  <ellipse cx="274" cy="340" rx="40" ry="31" fill="#000" />
                </mask>
              </defs>
              <g mask="url(#b-hole)" fill="#fff">
                <rect x="154" y="138" width="72" height="236" rx="34" />
                <path d="M194,156 C272,142 338,168 338,208 C338,248 288,268 194,264 Z" />
                <path d="M194,282 C284,276 348,306 348,340 C348,372 288,388 194,382 Z" />
                <rect x="172" y="336" width="70" height="52" rx="26" />
              </g>
            </svg>
          </div>
          <div class="brand-txt">
            <h1>班底</h1>
            <p class="brand-sub">登录后选一台电脑，接着干</p>
          </div>
        </header>

        <label class="lab" for="phoneInput">手机号</label>
        <input
          id="phoneInput"
          class="field"
          type="tel"
          inputmode="numeric"
          enterkeyhint="next"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          maxlength="11"
          placeholder="11 位手机号"
          aria-label="手机号"
        />

        <label class="lab" for="passInput">密码</label>
        <!-- ⚠️ 故意用 type=text + 圆点掩码（-webkit-text-security），不是 type=password：
             Android 16 的 WebView 存密码弹窗走凭据管理器，View 层开关压不住（实测三轮）；
             从解析那一刻就不让它见到密码字段，判定才彻底失效。视觉效果一字不差。 -->
        <input
          id="passInput"
          class="field"
          type="text"
          style="-webkit-text-security:disc"
          enterkeyhint="go"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="密码（至少 8 位）"
          aria-label="密码"
        />

        <button id="loginBtn" class="btn primary" type="button">登录</button>

        <!--
          中枢地址：默认官方中枢，不用管。自建 / 调试时展开改一次，记在 localStorage
          （启动页和业务页不同源，读不到那边的配置，所以这里自己存一份）。
        -->
        <details class="adv" id="hubAdv">
          <summary>中枢地址</summary>
          <input
            id="hubInput"
            class="field"
            type="url"
            inputmode="url"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="https://hub.yuancang.space"
            aria-label="中枢地址"
          />
          <p class="foot-hint">默认连官方中枢；自建或调试时改成自己的地址即可。</p>
        </details>

      </section>

      <!-- ============================================================ 设备列表 -->
      <section id="viewDevices" class="view" hidden>
        <h2 class="view-title">选择电脑</h2>
        <p class="view-sub" id="devSub">正在读取名册…</p>

        <div id="deviceList" class="paired"><div class="empty">读取中…</div></div>

        <p class="foot-hint" id="devHint">
          名单来自中枢。点一台直接进去 —— 那台电脑要先在它自己的页面登录过一次，才会出现在这里。
        </p>

        <button id="devRefresh" class="btn" type="button">刷新</button>
        <!-- 退出登录按钮（2026-11-07 用户拍板去掉）：退出只有一个正路 ——
             进了面板在「我的 → 退出登录」走 #bandi-bye 闭环。列表页不再摆第二颗，
             免得手滑把中枢会话清了还得重输密码。 -->
      </section>



      <!-- 状态条钉在页面底部（CSS position:fixed），不占布局位、不推输入框 -->
      <p id="status" class="status" hidden></p>
    </main>

<script src="launcher.js"></script>
  </body>
</html>
