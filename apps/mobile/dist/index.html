<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>班底</title>
    <link rel="stylesheet" href="launcher.css" />
  </head>
  <body>
    <main class="wrap">
      <!--
        2026-11-07 主路径改版（用户定稿）：手机端 = **账号密码登录 → 设备列表 → 点一台进去**。
          1. 首屏只有一件事：用手机号和密码登中枢（与电脑上那个账号同一套，中枢签发）。
          2. 登录后拿到「我名下的电脑」名册，点一台 → 中枢签一张一次性票 →
             打开 `<那台电脑>/hub/enter?ticket=…`，电脑验票发会话，直接进面板。
             这一路**不用再输码**：票就是进门凭据（契约 §五/§六）。
          3. 扫码 / 邀请码 / 已配对降级成兜底，收在「连不上中枢？」那一组里 ——
             中枢连不上、电脑还没进名册、或者想把这台手机配成长期钥匙时才用。

        视觉沿用 2026-11-05 定稿的原生味儿：左对齐品牌区、inset grouped 列表、
        行内 hairline、底部固定的状态条。结构契约：launcher.js 依赖的 id 不能改。
      -->

      <!-- ============================================================ 登录 -->
      <section id="viewHome" class="view view-home">
        <header class="brand">
          <!--
            2026-11-06 品牌统一：文字「B」换成与登录页/主站同源的真 B 字标
            （双椭圆镂空，auth.mjs brandSvg / index.html 同一笔画）。渐变底不变。
          -->
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 512 512" role="img" aria-label="班底">
              <defs>
                <mask id="b-hole">
                  <rect width="512" height="512" fill="#fff" />
                  <ellipse cx="268" cy="206" rx="36" ry="29" fill="#000" />
                  <ellipse cx="274" cy="340" rx="40" ry="31" fill="#000" />
                </mask>
              </defs>
              <g mask="url(#b-hole)" fill="#fff">
                <rect x="154" y="138" width="72" height="236" rx="34" />
                <path d="M194,156 C272,142 338,168 338,208 C338,248 288,268 194,264 Z" />
                <path d="M194,282 C284,276 348,306 348,340 C348,372 288,388 194,382 Z" />
                <rect x="172" y="336" width="70" height="52" rx="26" />
              </g>
            </svg>
          </div>
          <div class="brand-txt">
            <h1>班底</h1>
            <p class="brand-sub">登录后选一台电脑，接着干</p>
          </div>
        </header>

        <label class="lab" for="phoneInput">手机号</label>
        <input
          id="phoneInput"
          class="field"
          type="tel"
          inputmode="numeric"
          enterkeyhint="next"
          autocomplete="username"
          autocapitalize="off"
          spellcheck="false"
          maxlength="11"
          placeholder="11 位手机号"
          aria-label="手机号"
        />

        <label class="lab" for="passInput">密码</label>
        <input
          id="passInput"
          class="field"
          type="password"
          enterkeyhint="go"
          autocomplete="current-password"
          placeholder="密码（至少 8 位）"
          aria-label="密码"
        />

        <button id="loginBtn" class="btn primary" type="button">登录</button>

        <!--
          中枢地址：默认官方中枢，不用管。自建 / 调试时展开改一次，记在 localStorage
          （启动页和业务页不同源，读不到那边的配置，所以这里自己存一份）。
        -->
        <details class="adv" id="hubAdv">
          <summary>中枢地址</summary>
          <input
            id="hubInput"
            class="field"
            type="url"
            inputmode="url"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="https://hub.yuancang.space"
            aria-label="中枢地址"
          />
          <p class="foot-hint">默认连官方中枢；自建或调试时改成自己的地址即可。</p>
        </details>

        <p class="sec-label">连不上中枢？</p>

        <!-- 兜底三件套：都通向"某台电脑的面板"，只是证明方式不同 -->
        <div class="alt">
          <button id="scanEntry" class="alt-row" type="button">
            <span class="alt-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="6.4" height="6.4" rx="1.7" />
                <rect x="14.6" y="3" width="6.4" height="6.4" rx="1.7" />
                <rect x="3" y="14.6" width="6.4" height="6.4" rx="1.7" />
                <path d="M14.6 14.6h2.9v2.9h-2.9z" />
                <path d="M20.4 14.6v.01M20.4 21v-3.5M17.6 21h-3" />
              </svg>
            </span>
            <span class="alt-txt">
              <span class="alt-label">扫码连接</span>
              <span class="alt-meta">对准电脑屏幕上的二维码</span>
            </span>
            <span class="alt-chev" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 5l7 7-7 7" />
              </svg>
            </span>
          </button>

          <button id="codeEntry" class="alt-row" type="button">
            <span class="alt-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.8" y="4" width="18.4" height="16" rx="2.6" />
                <path d="M7.2 9h.01M12 9h.01M16.8 9h.01M7.2 14h.01M12 14h.01M16.8 14h.01" />
              </svg>
            </span>
            <span class="alt-txt">
              <span class="alt-label">输入邀请码</span>
              <span class="alt-meta">电脑上的 9 位数字</span>
            </span>
            <span class="alt-chev" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 5l7 7-7 7" />
              </svg>
            </span>
          </button>

          <!-- 这台手机连过的电脑（Rust 侧 shell.json）；没有记录时整行不出现 -->
          <button id="pairedEntry" class="alt-row" type="button" hidden>
            <span class="alt-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.6" y="3.8" width="18.8" height="12.8" rx="2.4" />
                <path d="M8.4 20.4h7.2M12 16.6v3.8" />
              </svg>
            </span>
            <span class="alt-txt">
              <span class="alt-label">已配对的电脑</span>
              <span class="alt-meta" id="pairedMeta">读取中…</span>
            </span>
            <span class="alt-chev" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 5l7 7-7 7" />
              </svg>
            </span>
          </button>
        </div>
      </section>

      <!-- ============================================================ 设备列表 -->
      <section id="viewDevices" class="view" hidden>
        <h2 class="view-title">选择电脑</h2>
        <p class="view-sub" id="devSub">正在读取名册…</p>

        <div id="deviceList" class="paired"><div class="empty">读取中…</div></div>

        <p class="foot-hint" id="devHint">
          名单来自中枢。点一台直接进去 —— 那台电脑要先在它自己的页面登录过一次，才会出现在这里。
        </p>

        <button id="devRefresh" class="btn" type="button">刷新</button>
        <button id="devLogout" class="btn danger" type="button">退出登录</button>
      </section>

      <!-- ============================================================ 邀请码 -->
      <section id="viewCode" class="view" hidden>
        <div class="nav">
          <button id="codeBack" class="nav-back" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" />
            </svg>
            返回
          </button>
        </div>

        <h2 class="view-title">输入邀请码</h2>
        <p class="view-sub">电脑上「设置 → 手机配对」里那串 9 位数字</p>

        <label class="lab" for="addrInput">电脑地址</label>
        <input
          id="addrInput"
          class="field"
          type="text"
          inputmode="url"
          enterkeyhint="next"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="192.168.1.5:18787"
          aria-label="电脑地址"
        />
        <label class="lab" for="codeInput">邀请码</label>
        <input
          id="codeInput"
          class="code-input"
          type="text"
          inputmode="numeric"
          enterkeyhint="go"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          maxlength="11"
          placeholder="000 000 000"
          aria-label="九位邀请码"
        />
        <button id="connectBtn" class="btn primary" type="button">连接</button>
        <p class="foot-hint">
          从电脑上复制整条配对链接、粘进地址栏，也可以。
        </p>
      </section>

      <!-- ============================================================ 已配对 -->
      <section id="viewPaired" class="view" hidden>
        <div class="nav">
          <button id="pairedBack" class="nav-back" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" />
            </svg>
            返回
          </button>
        </div>

        <h2 id="pairedTitle" class="view-title">已配对的电脑</h2>

        <div id="pairedList" class="paired"><div class="empty">读取中…</div></div>
        <p class="foot-hint" id="pairedHint">
          点一台看详情。凭据留在手机上，连接不用重新扫码。
        </p>

        <div id="pairedDetail" class="pd" hidden>
          <div class="pd-card">
            <div class="pd-name" id="pdName"></div>
            <div class="pd-host" id="pdHost"></div>
          </div>

          <dl class="pd-rows">
            <div class="pd-row">
              <dt>电脑地址</dt>
              <dd id="pdOrigin"></dd>
            </div>
            <div class="pd-row">
              <dt>最近连接</dt>
              <dd id="pdLast"></dd>
            </div>
          </dl>

          <button id="pdConnect" class="btn primary" type="button">连接</button>
          <button id="pdForget" class="btn danger" type="button">取消配对</button>
          <p class="foot-hint">
            取消配对只清这台手机上的记录，电脑端不受影响。
          </p>
        </div>
      </section>

      <!-- 状态条钉在页面底部（CSS position:fixed），不占布局位、不推输入框 -->
      <p id="status" class="status" hidden></p>
    </main>

    <!-- 扫码遮罩：铺满全屏，video 垫底，取景框和提示浮在上面（恒深色，相机画面） -->
    <div id="scan" class="scan" hidden>
      <video id="scanVideo" class="scan-video" playsinline muted autoplay></video>
      <div class="scan-top">
        <p class="scan-head">扫描二维码</p>
        <button id="scanCancel" class="scan-x" type="button" aria-label="关闭扫码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="scan-center">
        <div class="scan-guide"><i></i><i></i><i></i><i></i><span class="scan-sweep"></span></div>
        <p id="scanMsg" class="scan-msg">对准电脑上的二维码</p>
      </div>
      <p class="scan-tip">电脑上「设置 → 手机配对」</p>
    </div>

    <script src="vendor/jsQR.js"></script>
    <script src="scanner.js"></script>
    <script src="launcher.js"></script>
  </body>
</html>
