# 页面能调壳的自定义命令，必须显式给权限（Tauri v2 的 ACL）。
#
# 为什么需要这个文件：页面是从 http://127.0.0.1:<port> 加载的「远程」来源，
# Tauri 对远程来源的自定义命令一律先过 ACL —— 没有这条会直接报
# `Command pick_file not allowed by ACL`（pick_directory 当年就踩过，见 pick-dir.toml）。
# 命令本体和用途见 apps/desktop/src/lib.rs 的 pick_file。

[[permission]]
identifier = "allow-pick-file"
description = "允许页面弹出壳的原生文件选择框（pick_file）。远程连接「私钥路径」的选择按钮用它 —— 带主窗口做 owner 的 IFileOpenDialog（选文件，不选目录）。"
commands.allow = ["pick_file"]
