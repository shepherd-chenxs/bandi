[package]
name = "bandi-desktop"
version = "0.0.0"
description = "桌面薄壳：拉起本地控制面，窗口指向它（界面用 apps/web）"
authors = ["牧羊人"]
edition = "2021"
rust-version = "1.77"

# 注意：本文件里的 version 是「构建占位值」，不是版本真源。
# 版本真源只有一个：apps/desktop/version.json。
# build.rs 会从 version.json 取值，编译进程序（APP_VERSION），并同步到 tauri.conf.json 供打包用。

[lib]
name = "bandi_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = { version = "1", features = ["preserve_order"] }

[dependencies]
# 薄壳只需要 tauri：窗口 + 进程。
# `v1.0.0` 那条「SSH 服务器登记」线整体删掉之后，serde_yaml / russh / tokio / getrandom /
# chrono 全都不需要了 —— russh 尤其大（连带几百个 crate），卸掉后构建快一个量级。
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows 专用 Win32 调用（见 src/lib.rs，启动防闪 + 原生目录选择框）：
#   · `pre_stage_geometry` —— 隐藏期用 SetWindowPos 把窗口撑到工作区，让 WebView2 提前按最终尺寸画完；
#   · `fix_restore_size`  —— 露脸后用 SetWindowPlacement 把「双击还原」的尺寸写回 1024×688；
#   · `pick_directory`    —— 页面里「选择目录」走 IFileOpenDialog（带 owner 窗口，永远压在壳窗口上）。
# 版本跟着 tauri 2.12 用同一份 windows 0.62，别升 —— HWND 类型要跟 `Window::hwnd()` 对得上。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
