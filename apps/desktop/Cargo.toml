[package]
name = "bandi-desktop"
version = "0.0.0"
description = "桌面薄壳：拉起本地控制面，窗口指向它（界面用 apps/web）"
authors = ["牧羊人"]
edition = "2021"
rust-version = "1.77"

# 注意：本文件里的 version 是「构建占位值」，不是版本真源。
# 版本真源只有一个：apps/desktop/version.json。
# build.rs 会从 version.json 取值，编译进程序（APP_VERSION），并同步到 tauri.conf.json 供打包用。

[lib]
name = "bandi_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = { version = "1", features = ["preserve_order"] }

[dependencies]
# 薄壳只需要 tauri：窗口 + 进程。
# `v1.0.0` 那条「SSH 服务器登记」线整体删掉之后，serde_yaml / russh / tokio / getrandom /
# chrono 全都不需要了 —— russh 尤其大（连带几百个 crate），卸掉后构建快一个量级。
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
