<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>班底 · 研发面板改版稿</title>
<style>
/* 研发面板改版 · 2026-10-24
   改动：页头信息分组（项目名放大，状态/路径/更新时间降级）、
   状态统一语义徽标（已纳管/已发布=绿，未纳管=琥珀，未发布=中性灰）、
   版本表「发布」列改「状态」，说明默认两行截断可展开，空值不占徽标（—）。
   首屏说明折叠成一行，点开再看。 */
:root {
  color-scheme: dark;
  --bg: #08090a;
  --rail: #0b0b0d;
  --side: #0d0e10;
  --panel: #111214;
  --line: #202225;
  --line-soft: #1a1b1e;
  --text: #e8e9ea;
  --dim: #9b9ea3;
  --dim-2: #6b6e73;
  --accent: #0a84ff;
  --ok: #3fb950;
  --warn: #d29922;
  --chip: #1a1b1e;
  --hover: #16171a;
  --r-row: 6px;
  --r-panel: 8px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: #0b0c0e; color: var(--text); font-family: var(--font);
  font-size: 13px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
.doc { max-width: 1600px; margin: 0 auto; padding: 26px 28px 70px; }
.doc-head { margin-bottom: 20px; }
.doc-head h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.doc-head p { margin: 0; color: var(--dim); font-size: 12.5px; max-width: 900px; }
.doc-head b { color: var(--text); font-weight: 600; }
.canvas { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.artboard { margin: 0; flex: 0 0 auto; }
.artboard figcaption { margin: 0 0 8px; font-size: 12px; color: var(--dim-2); }
.artboard figcaption .k { font-weight: 600; color: var(--text); margin-right: 8px; }
.screen {
  overflow: hidden; background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.35);
}
.notes {
  list-style: none; margin: 10px 0 0; padding: 10px 12px; max-width: 1440px;
  border-left: 2px solid var(--accent); background: #101113; border-radius: 0 8px 8px 0;
}
.notes li { font-size: 11.5px; color: var(--dim); margin: 2px 0; line-height: 1.6; }
.notes b { color: var(--text); font-weight: 600; }

/* 骨架 */
.app { display: grid; grid-template-columns: 68px 300px minmax(0,1fr); height: 100%; }
.rail {
  background: var(--rail); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 6px;
}
.rail-logo {
  width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
  font-weight: 700; color: #fff; background: linear-gradient(135deg, #4b6cb7, #182848); margin-bottom: 10px;
}
.nav-btn {
  width: 56px; border: 0; background: transparent; color: var(--dim); cursor: pointer;
  display: grid; justify-items: center; gap: 3px; padding: 8px 0; border-radius: 10px;
  font: inherit; font-size: 11px;
}
.nav-btn:hover { background: var(--hover); color: var(--text); }
.nav-btn.active { color: var(--accent); background: #17233f; }
.nav-btn svg { width: 21px; height: 21px; }
.rail .spacer { flex: 1; }

.list-panel {
  background: var(--side); border-right: 1px solid var(--line);
  display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0;
}
.list-head { padding: 13px 16px 8px; }
.crumb { color: var(--dim); font-size: 13px; font-weight: 600; cursor: pointer; }
.crumb.cur { color: var(--text); }
.crumb-sep { color: var(--dim-2); margin: 0 3px; }
.list-search { padding: 0 12px 8px; }
.search-box {
  width: 100%; height: 28px; padding: 0 10px; border-radius: var(--r-row);
  border: 1px solid var(--line); background: var(--side); color: var(--text);
  font: inherit; font-size: 12.5px; outline: none;
}
.search-box::placeholder { color: var(--dim-2); }
.list-body { min-height: 0; overflow: auto; padding: 0 8px; }
.item { display: flex; align-items: flex-start; gap: 9px; padding: 8px; border-radius: var(--r-row); cursor: pointer; }
.item:hover { background: var(--hover); }
.item.active { background: var(--hover); }
.item .who { min-width: 0; flex: 1; }
.line1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.line1 b { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line2 { display: flex; align-items: center; gap: 6px; margin-top: 4px; min-width: 0; }
.line2 .txt { font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-foot { padding: 9px 16px; border-top: 1px solid var(--line-soft); font-size: 11.5px; color: var(--dim-2); }

.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.detail { min-height: 0; overflow: auto; padding: 20px 26px 40px; }
.detail-body { max-width: 1020px; margin: 0 auto; }

/* 状态徽标：语义统一。绿=正常在轨，琥珀=需要处理，灰=中性/未发生 */
.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px;
  border-radius: 999px; font-size: 11px; white-space: nowrap; flex: 0 0 auto;
  border: 1px solid var(--line); background: var(--chip); color: var(--dim);
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.sm { height: 18px; padding: 0 7px; font-size: 10.5px; }
.badge.ok { color: var(--ok); border-color: rgba(63,185,80,.4); background: rgba(63,185,80,.1); }
.badge.warn { color: var(--warn); border-color: rgba(210,153,34,.4); background: rgba(210,153,34,.1); }
.badge.neutral::before { opacity: .55; }

.p-head { display: flex; align-items: flex-start; gap: 14px; }
.p-head-main { flex: 1; min-width: 0; }
.p-head h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.p-meta { display: flex; align-items: center; gap: 7px; margin-top: 6px; min-width: 0; }
.pill {
  display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--chip); color: var(--dim);
  font-size: 11.5px; font-family: var(--mono); max-width: 460px; cursor: pointer; user-select: none;
}
.pill > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill:hover { color: var(--text); border-color: var(--accent); }
.pill.copied { color: var(--ok); border-color: rgba(63,185,80,.5); background: rgba(63,185,80,.12); }
.dot-sep { color: var(--dim-2); font-size: 11px; }
.meta-txt { font-size: 12px; color: var(--dim); white-space: nowrap; }

/* 说明折叠：默认只占一行 */
.intro { border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--panel); margin-top: 16px; }
.intro summary {
  list-style: none; cursor: pointer; padding: 9px 14px; font-size: 12.5px; color: var(--dim);
  display: flex; align-items: center; gap: 8px;
}
.intro summary::-webkit-details-marker { display: none; }
.intro summary:hover { color: var(--text); }
.intro summary .chev { flex: 0 0 auto; color: var(--dim-2); font-size: 10px; }
.intro[open] summary .chev { transform: rotate(90deg); }
.intro summary b { color: var(--text); font-weight: 600; }
.intro-body { padding: 0 14px 12px; font-size: 12.5px; color: var(--dim); line-height: 1.7; }
.intro-body code { font-family: var(--mono); font-size: 11.5px; color: var(--text); }
.intro-body .note { display: block; margin-top: 6px; font-size: 12px; color: var(--dim-2); }

.group { border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--panel); overflow: hidden; }
.group + .group { margin-top: 14px; }
.group-title {
  display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 600;
  padding: 11px 14px; border-bottom: 1px solid var(--line);
}
.group-title .sub { font-size: 11.5px; color: var(--dim-2); font-weight: 400; }

.facts { display: grid; grid-template-columns: minmax(0,1.4fr) .6fr .6fr; }
.fact { padding: 11px 14px; min-width: 0; }
.fact + .fact { border-left: 1px solid var(--line-soft); }
.fact .k { font-size: 11.5px; color: var(--dim); margin-bottom: 3px; }
.fact .v { font-size: 13px; color: var(--text); overflow-wrap: anywhere; }
.fact .v.mono { font-family: var(--mono); font-size: 12px; }
.fact .v b { font-size: 15px; font-weight: 600; margin-right: 4px; }
.fact .v .dim { color: var(--dim); }

/* 版本表：说明默认两行截断，点「展开」看全文 */
.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12.5px; }
.tbl th {
  text-align: left; font-weight: 500; color: var(--dim); font-size: 11.5px;
  padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--side);
}
.tbl td { padding: 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; min-width: 0; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.mono { font-family: var(--mono); font-size: 11.5px; }
.tbl td .path { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--dim); line-height: 1.6; }
.desc.open { -webkit-line-clamp: unset; display: block; }
.more {
  border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 11.5px;
  padding: 4px 0 0; cursor: pointer;
}
.more:hover { text-decoration: underline; }
.empty-cell { color: var(--dim-2); font-size: 12px; }
.tip { font-size: 12px; color: var(--dim); margin-top: 10px; line-height: 1.6; }

/* 状态小稿 */
.state-card { border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--panel); width: 446px; }
.state-card .head { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.state-card .body { padding: 14px; min-height: 210px; }
.state-label { font-size: 11.5px; color: var(--dim-2); margin-top: 8px; line-height: 1.6; }
.sk { border-radius: 5px; background: linear-gradient(90deg, #17181b 25%, #1e2023 45%, #17181b 65%); background-size: 200% 100%; animation: shine 1.2s infinite; }
.sk.t { height: 13px; width: 38%; margin-bottom: 10px; }
.sk.r { height: 11px; margin-bottom: 8px; }
.sk.r.w60 { width: 60%; } .sk.r.w80 { width: 80%; } .sk.r.w45 { width: 45%; }
@keyframes shine { to { background-position: -200% 0; } }
.err {
  display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px;
  border: 1px solid rgba(248,81,73,.4); background: rgba(248,81,73,.08);
  border-radius: var(--r-panel); color: var(--text); font-size: 12.5px; line-height: 1.6;
}
.err .mark { color: #f85149; font-weight: 700; flex: 0 0 auto; }
.err .retry { color: var(--accent); cursor: pointer; white-space: nowrap; }
.empty { text-align: center; padding: 30px 16px; color: var(--dim-2); font-size: 12.5px; line-height: 1.7; }
.empty b { display: block; color: var(--dim); font-size: 13px; margin-bottom: 4px; }
.empty code { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
</style>
</head>

                  </table>
                </div>

                <div class="tip">版本清单只读，没有动作按钮。发布记录与说明超长都截断：路径悬停看全文，说明点「展开」。</div>
              </div>
            </div>
          </main>
        </div>
      </div>
      <ul class="notes">
        <li><b>页头</b>：项目名 20px 主标题 + 状态徽标；路径 pill 可点复制（成功变「已复制」），更新时间跟在后面，不再和项目名抢层级。</li>
        <li><b>说明</b>：默认折叠成一行，点开才占空间 —— 首屏直接看到版本数和表。</li>
        <li><b>徽标语义</b>：绿 = 已纳管 / 已发布（在轨），琥珀 = 未纳管（要处理），灰 = 未发布（中性）。左右列表与详情同一套。</li>
        <li><b>版本表</b>：「发布记录」空显示 —，不占徽标；说明默认两行截断，长的那行点「展开」看全文；路径列固定宽，超长省略号 + 悬停全文。</li>
      </ul>
    </figure>

    <figure class="artboard" style="width:1380px">
      <figcaption><span class="k">02 · 详情区状态</span>加载 / 报错 / 空态 · 未画全屏，只画详情区变化</figcaption>
      <div class="screen" style="width:1380px;height:320px">
        <div style="display:flex;gap:20px;padding:20px">
          <div class="state-card">
            <div class="head">加载中 <span class="badge neutral sm">读取进度文件</span></div>
            <div class="body">
              <div class="sk t"></div>
              <div class="sk r w60"></div>
              <div class="sk r w80"></div>
              <div class="sk r w45"></div>
              <div class="state-label">读 .bandi/status.yaml 期间：表格先出骨架行，不闪空白。</div>
            </div>
          </div>
          <div class="state-card">
            <div class="head">读取失败 <span class="badge warn sm">报错</span></div>
            <div class="body">
              <div class="err"><span class="mark">!</span><span>读不到 .bandi/status.yaml：文件不存在或没有权限。已有记录保留，不会自动删。<span class="retry">重试</span></span></div>
              <div class="state-label">整块报错不白屏；说人话，不甩错误码。</div>
            </div>
          </div>
          <div class="state-card">
            <div class="head">没有版本记录 <span class="badge warn sm">未纳管</span></div>
            <div class="body">
              <div class="empty">
                <b>还没有版本记录</b>
                在项目根放一个 <code>.bandi/status.yaml</code> 后，这里会自己读出来。
              </div>
              <div class="state-label">「未纳管」说读不到，不显示 0 —— 读不到和 0 个版本是两件事。</div>
            </div>
          </div>
        </div>
      </div>
    </figure>
  </div>
</div>

<script>
// 设计稿内的两个交互示意：路径复制回执、说明展开/收起。
(function () {
  document.querySelectorAll('.copy-pill').forEach(function (el) {
    var label = el.querySelector('span').textContent;
    el.addEventListener('click', function () {
      var done = function () {
        el.classList.add('copied');
        el.querySelector('span').textContent = '已复制';
        setTimeout(function () {
          el.classList.remove('copied');
          el.querySelector('span').textContent = label;
        }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(el.getAttribute('data-path')).then(done, done);
      } else { done(); }
    });
  });
  document.querySelectorAll('.more').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var desc = btn.parentElement.querySelector('.desc');
      var open = desc.classList.toggle('open');
      btn.textContent = open ? '收起' : '展开';
    });
  });
})();
</script>
</body>
