<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>班底 · 项目成员 tab / 项目详情改造（设计稿）</title>
<style>
:root {
  color-scheme: dark;
  --bg: #08090a;
  --rail: #0b0b0d;
  --side: #0d0e10;
  --panel: #111214;
  --line: #202225;
  --line-soft: #1a1b1e;
  --text: #e8e9ea;
  --dim: #9b9ea3;
  --dim-2: #6b6e73;
  --label: #9b9ea3;
  --accent: #0a84ff;
  --ok: #3fb950;
  --bad: #f85149;
  --chip: #1a1b1e;
  --hover: #16171a;
  --input: #0d0e10;
  --r-row: 6px;
  --r-panel: 8px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
}

:root[data-theme='light'] {
  color-scheme: light;
  --bg: #f7f8f9;
  --rail: #f0f1f3;
  --side: #fcfcfd;
  --panel: #ffffff;
  --line: #e4e6e9;
  --line-soft: #eaeaec;
  --text: #1a1c1f;
  --dim: #5f646c;
  --dim-2: #7e838b;
  --label: #545860;
  --accent: #0066cc;
  --ok: #12813c;
  --bad: #cf222e;
  --chip: #f2f4f6;
  --hover: #f2f3f5;
  --input: #ffffff;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: #0b0c0e;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

/* 文档页头：只属于这份稿，不属于产品 UI */
.doc { max-width: 1600px; margin: 0 auto; padding: 34px 30px 90px; }
.doc-head { margin-bottom: 26px; }
.doc-eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 10px;
}
.doc-head h1 { margin: 0 0 12px; font-size: 30px; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; }
.doc-head p { margin: 0 0 18px; max-width: 900px; color: var(--dim); font-size: 13.5px; }
.doc-decision { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
.decision {
  border: 1px solid var(--line); border-radius: var(--r-panel);
  background: #101113; padding: 13px 15px;
}
:root[data-theme='light'] .decision { background: #fff; }
.decision b { display: block; font-size: 12px; color: var(--text); margin-bottom: 4px; }
.decision span { font-size: 12px; color: var(--dim); line-height: 1.6; display: block; }
.decision .n { font-family: var(--mono); color: var(--dim-2); font-size: 11px; margin-right: 6px; }

.theme-toggle {
  position: fixed; right: 22px; top: 22px; z-index: 99;
  height: 30px; padding: 0 13px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--panel); color: var(--dim);
  font: inherit; font-size: 12px; cursor: pointer;
}
.theme-toggle:hover { color: var(--text); border-color: var(--accent); }

.canvas { display: flex; flex-wrap: wrap; gap: 26px; align-items: flex-start; }
.artboard { margin: 0; flex: 0 0 auto; }
.artboard figcaption { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; font-size: 12.5px; }
.artboard figcaption .k { font-weight: 600; color: var(--text); }
.artboard figcaption .m { color: var(--dim-2); font-size: 11.5px; }

.screen {
  position: relative; overflow: hidden; background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 14px 40px rgba(0,0,0,.35);
}
:root[data-theme='light'] .screen { box-shadow: 0 14px 40px rgba(20,24,40,.12); }

.notes {
  list-style: none; margin: 10px 0 0; padding: 10px 12px;
  border-left: 2px solid var(--accent);
  background: #101113; border-radius: 0 var(--r-panel) var(--r-panel) 0;
  max-width: 1440px;
}
:root[data-theme='light'] .notes { background: #fff; }
.notes li { font-size: 11.5px; color: var(--dim); margin: 2px 0; line-height: 1.6; }
.notes b { color: var(--text); font-weight: 600; }
.notes .go { color: var(--accent); }

/* 应用骨架（真实三栏复刻） */
.app { display: grid; height: 100%; }
.app.three { grid-template-columns: 68px 300px minmax(0,1fr); }
.app.two { grid-template-columns: 68px minmax(0,1fr); }

.rail {
  background: var(--rail); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 6px;
}
.rail-logo {
  width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
  font-weight: 700; color: #fff; background: linear-gradient(135deg, #4b6cb7, #182848);
  margin-bottom: 10px;
}
.nav-btn {
  width: 56px; border: 0; background: transparent; color: var(--dim); cursor: pointer;
  display: grid; justify-items: center; gap: 3px; padding: 8px 0; border-radius: 10px;
  font: inherit; font-size: 11px;
}
.nav-btn:hover { background: #131416; color: var(--text); }
:root[data-theme='light'] .nav-btn:hover { background: #e6e8ec; }
.nav-btn.active { color: var(--accent); background: #17233f; }
:root[data-theme='light'] .nav-btn.active { background: #e9f0fd; }
.nav-btn svg { width: 21px; height: 21px; }
.rail .spacer { flex: 1; }

.list-panel {
  background: var(--side); border-right: 1px solid var(--line);
  display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0;
}
.list-head { padding: 13px 16px 8px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.list-title { display: flex; align-items: center; min-width: 0; flex: 1; overflow: hidden; }
.list-title > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb { color: var(--dim); font-size: 13px; font-weight: 600; cursor: pointer; }
.crumb:hover { color: var(--text); }
.crumb.cur { color: var(--text); }
.crumb-sep { color: var(--dim-2); flex: 0 0 auto; margin: 0 3px; }
.list-add {
  flex: 0 0 auto; width: 24px; height: 24px; border: 0; border-radius: 6px;
  background: transparent; color: var(--dim); cursor: pointer; font-size: 17px; line-height: 1;
}
.list-add:hover { background: var(--hover); color: var(--text); }
.list-search { padding: 0 12px 8px; }
.search-box {
  width: 100%; height: 28px; padding: 0 10px; border-radius: var(--r-row);
  border: 1px solid var(--line); background: var(--input); color: var(--text);
  font: inherit; font-size: 12.5px; outline: none;
}
.search-box::placeholder { color: var(--dim-2); }
.list-body { min-height: 0; overflow: auto; padding: 0 8px; }
.item { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: var(--r-row); cursor: pointer; }
.item:hover { background: var(--hover); }
.item.active { background: var(--hover); }
.item .who { min-width: 0; flex: 1; }
.line1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.line1 b { font-size: 13.5px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line2 { font-size: 12px; color: var(--dim); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
.badge { flex: 0 0 auto; font-size: 10.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; line-height: 16px; white-space: nowrap; }
.badge.built { color: var(--accent); border-color: rgba(10,132,255,.4); }
.list-foot { padding: 9px 16px; border-top: 1px solid var(--line-soft); font-size: 11.5px; color: var(--dim-2); }

.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.detail { min-height: 0; overflow: auto; padding: 20px 26px 44px; }
.detail-body { max-width: 980px; margin: 0 auto; }

.p-head { display: flex; align-items: flex-start; gap: 14px; }
.p-head-main { flex: 1; min-width: 0; }
.p-head h2 { margin: 0; font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.p-meta { margin-top: 5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--chip); color: var(--dim); font-size: 11.5px;
  font-family: var(--mono); white-space: nowrap;
}
.pill.role { color: var(--accent); border-color: rgba(10,132,255,.35); background: rgba(10,132,255,.1); font-family: var(--font); }
.pill.copy-pill { cursor: pointer; user-select: none; }
.pill.copy-pill:hover { color: var(--text); border-color: var(--accent); }
.pill.copy-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pill.copy-pill[aria-pressed='true'] { color: var(--ok); border-color: rgba(63,185,80,.5); background: rgba(63,185,80,.12); }
.hero-actions { display: flex; gap: 8px; align-items: center; }
.btn {
  height: 28px; padding: 0 12px; border-radius: var(--r-row);
  border: 1px solid var(--line); background: var(--panel); color: var(--dim);
  font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--text); }
.btn.primary { background: #0071e3; border-color: transparent; color: #fff; }
:root[data-theme='light'] .btn.primary { background: #0066cc; }
.btn.danger { color: var(--bad); border-color: rgba(248,81,73,.35); }

.group { border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--panel); overflow: hidden; }
.group + .group { margin-top: 14px; }
.group-title { font-size: 13px; font-weight: 600; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.form-row {
  display: grid; grid-template-columns: 132px minmax(0,1fr); gap: 12px;
  padding: 11px 14px; align-items: center;
}
.form-row + .form-row { border-top: 1px solid var(--line-soft); }
.form-row.top { align-items: start; }
.form-row.top > .row-label { padding-top: 8px; }
.row-label { font-size: 13px; color: var(--label); }
.row-label .hint { display: block; font-size: 11px; color: var(--label); font-weight: 400; margin-top: 2px; }
.field { color: var(--text); }
.field-box {
  border: 1px solid var(--line); background: var(--input); border-radius: var(--r-row);
  padding: 7px 10px; min-height: 32px; color: var(--text);
}
.field-box.placeholder { color: var(--dim-2); }
.date-row { display: flex; align-items: center; gap: 8px; }
.date-row .sep { color: var(--dim-2); font-size: 12px; }
.date-note { font-size: 11.5px; color: var(--dim-2); margin-top: 6px; }

/* tabs */
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin: 20px 0 16px; }
.tab { border: 0; background: transparent; color: var(--dim); cursor: pointer; font: inherit; font-size: 13px; padding: 0 2px 10px; }
.tab.on { color: var(--text); font-weight: 500; box-shadow: inset 0 -2px 0 var(--accent); }
.tab-n { font-size: 11px; color: var(--dim); background: var(--chip); border-radius: 99px; padding: 0 6px; margin-left: 4px; }

/* 头像 */
.avatar { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 6px; display: grid; place-items: center;
          font-weight: 600; font-size: 12px; color: #fff; background: #3a4152; }
.avatar.gone { background: var(--chip); color: var(--dim-2); }

/* 成员列表 */
.members-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
}
.members-head .members-title { font-size: 13px; font-weight: 600; color: var(--text); }
.members-head .members-title .cnt { font-weight: 400; color: var(--dim); font-size: 12px; margin-left: 2px; }
.add-mini { height: 24px; padding: 0 10px; border-radius: var(--r-row); border: 1px solid var(--line);
            background: var(--panel); color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; }
.add-mini:hover { border-color: var(--accent); }

.mbr-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; min-height: 52px;
  cursor: pointer;
}
.mbr-row + .mbr-row { border-top: 1px solid var(--line-soft); }
.mbr-row:hover { background: var(--hover); }
.mbr-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mbr-name { font-size: 13.5px; font-weight: 500; color: var(--text); white-space: nowrap; }
.dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--dim-2); }
.dot.busy { background: var(--ok); }
.mbr-runtime { color: var(--label); }
.mbr-act {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 3px;
  color: var(--accent); font-size: 12.5px; cursor: pointer; background: transparent; border: 0;
  font: inherit; padding: 4px 6px; border-radius: 6px;
}
.mbr-act:hover { background: var(--hover); }

/* 已删成员：不可点 */
.mbr-row.gone { cursor: default; }
.mbr-row.gone:hover { background: transparent; }
.mbr-row.gone .mbr-name { color: var(--dim-2); font-weight: 400; }
.mbr-row.gone .pill { color: var(--dim-2); border-color: var(--line); background: transparent; }
.gone-tag { font-size: 11px; color: var(--dim-2); }

/* 空态 */
.members-empty {
  padding: 34px 18px 38px; text-align: center; color: var(--dim-2);
}
.members-empty .big { font-size: 13px; color: var(--dim); margin-bottom: 4px; }
.members-empty .sub { font-size: 11.5px; }
.members-empty .add-mini { margin-top: 12px; }

/* 移动骨架 */
.m-app { display: flex; flex-direction: column; height: 100%; background: var(--bg); }
.m-top {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px;
  border-bottom: 1px solid var(--line); background: var(--side);
}
.m-back { border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 12.5px; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.m-title { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-act { flex: 0 0 auto; color: var(--accent); font-size: 12.5px; }
.m-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 14px 24px; }
.m-h { font-size: 19px; font-weight: 600; margin: 0 0 4px; }
.m-sub { font-size: 11.5px; color: var(--dim-2); font-family: var(--mono); margin-bottom: 14px; overflow-wrap: anywhere; }
.m-group { border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--panel); overflow: hidden; margin-bottom: 14px; }
.m-row { padding: 10px 12px; }
.m-row + .m-row { border-top: 1px solid var(--line-soft); }
.m-row .k { display: block; font-size: 11px; color: var(--dim); margin-bottom: 3px; }
.m-row .v { font-size: 13px; color: var(--text); overflow-wrap: anywhere; }
.m-tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
.m-tabs .tab { flex: 0 0 auto; padding-bottom: 9px; }

@media (max-width: 900px) {
  .doc { padding: 24px 16px 60px; }
  .doc-decision { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="doc">

  <header class="doc-head">
    <div class="doc-eyebrow">班底 · UI 设计稿 · 2026-10-24</div>
    <h1>项目详情 · 新增「项目成员」tab</h1>
    <p>成员从档案里的 chip 抽出来，单独成「项目成员」tab，复用员工详情骨架。项目经理不进这个 tab，仍只在档案显示。</p>
    <div class="doc-decision">
      <div class="decision">
        <b><span class="n">01</span>成员从档案抽出成 tab</b>
        <span>档案不再挤一排名字，只剩「干什么 / 项目经理 / 起止」；成员单独一页，一行一个人，信息有地方摆。</span>
      </div>
      <div class="decision">
        <b><span class="n">02</span>tab 插在中间</b>
        <span>顺序是「基础信息 / 项目成员 / 项目规章」。成员是项目的人，归在基本盘和规矩之间。</span>
      </div>
      <div class="decision">
        <b><span class="n">03</span>点成员行进员工详情</b>
        <span>整行可点、右侧「看详情」进员工详情页；不做就地展开简版资料。</span>
      </div>
    </div>
  </header>

  <div class="canvas">

    <!-- 01 · 项目成员 tab（桌面） -->
    <figure class="artboard" style="width:1440px">
      <figcaption><span class="k">01 · 项目成员 tab</span><span class="m">桌面 1440 × 900 · 档案三项 · 成员独立成页</span></figcaption>
      <div class="screen" style="width:1440px;height:900px">
        <div class="app three" style="height:900px">
          <nav class="rail">
            <div class="rail-logo">班</div>
            <button class="nav-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4.5 5.8h15v9.4H9.2l-4.7 3.8z"/></svg><span>消息</span>
            </button>
            <button class="nav-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9.2" cy="8.4" r="3.2"/><path d="M3.6 19c0-2.9 2.4-5 5.6-5s5.6 2.1 5.6 5"/><circle cx="17.3" cy="9.6" r="2.3"/><path d="M16 19c0-2.1.9-3.6 2.7-4.1"/></svg><span>通讯录</span>
            </button>
            <button class="nav-btn active">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.4" y="3.4" width="7.2" height="7.2" rx="1.8"/><rect x="13.4" y="3.4" width="7.2" height="7.2" rx="1.8"/><rect x="3.4" y="13.4" width="7.2" height="7.2" rx="1.8"/><rect x="13.4" y="13.4" width="7.2" height="7.2" rx="1.8"/></svg><span>工作台</span>
            </button>
            <div class="spacer"></div>
            <button class="nav-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4"/></svg><span>设置</span>
            </button>
          </nav>

          <aside class="list-panel">
            <div class="list-head">
              <div class="list-title"><span class="crumb">工作台</span><span class="crumb-sep">›</span><span class="crumb cur">项目</span></div>
              <button class="list-add" title="新建项目">＋</button>
            </div>
            <div class="list-search"><input class="search-box" placeholder="搜项目…" /></div>
            <div class="list-body">
              <div class="item active"><div class="who"><div class="line1"><b>班底</b><span class="badge built">内置</span></div><div class="line2">E:\02CodeSpace\github\bandi</div></div></div>
              <div class="item"><div class="who"><div class="line1"><b>喜儿</b></div><div class="line2">E:\work\喜儿</div></div></div>
              <div class="item"><div class="who"><div class="line1"><b>运维手册</b></div><div class="line2">E:\ops\runbook</div></div></div>
              <div class="item"><div class="who"><div class="line1"><b>装修 · 新家</b></div><div class="line2">D:\home\renovation</div></div></div>
            </div>
            <div class="list-foot">已归档（3）</div>
          </aside>

          <main class="main">
            <div class="detail">
              <div class="detail-body">
                <div class="p-head">
                  <div class="p-head-main">
                    <h2>班底 <span class="pill role">内置</span></h2>
                    <div class="p-meta">
                      <button type="button" class="pill copy-pill" data-path="E:\02CodeSpace\github\bandi" title="点击复制路径">E:\02CodeSpace\github\bandi</button>
                    </div>
                  </div>
                  <div class="hero-actions"><button class="btn primary">任务</button><button class="btn danger">删除</button></div>
                </div>

                <!-- 档案：成员 chips 已撤，只留三项 -->
                <div class="group" style="margin-top:18px">
                  <div class="group-title">项目档案 · 改了自动存</div>
                  <div class="form-row top">
                    <div class="row-label">干什么<span class="hint">一句话说清用途</span></div>
                    <textarea class="field-box">班底：给 AI 员工派活的协同工作台。</textarea>
                  </div>
                  <div class="form-row">
                    <div class="row-label">项目经理</div>
                    <div class="field">马超</div>
                  </div>
                  <div class="form-row">
                    <div class="row-label">开始 / 结束</div>

<script>
// 目录 pill 复制：点整颗 pill 复制路径，成功给「已复制」回执（2 秒后还原）
(function () {
  var clip = navigator.clipboard;
  document.querySelectorAll('.copy-pill').forEach(function (el) {
    var path = el.getAttribute('data-path') || '';
    var label = el.textContent;
    el.addEventListener('click', function () {
      var done = function () {
        el.textContent = '已复制';
        el.setAttribute('aria-pressed', 'true');
        clearTimeout(el.__t);
        el.__t = setTimeout(function () { el.textContent = label; el.removeAttribute('aria-pressed'); }, 2000);
      };
      if (clip && clip.writeText) clip.writeText(path).then(done, done);
      else {
        var ta = document.createElement('textarea');
        ta.value = path; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta); done();
      }
    });
  });
})();

(function () {
  var k = 'bandi.design.theme';
  var cur = 'dark';
  try { cur = localStorage.getItem(k) || 'dark'; } catch (e) {}
  var btn = document.getElementById('tt');
  function apply(t) {
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '浅色' : '深色';
    try { localStorage.setItem(k, t); } catch (e) {}
  }
  apply(cur);
  btn.addEventListener('click', function () {
    apply(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();
</script>
