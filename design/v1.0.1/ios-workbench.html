<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>班底 v1.0.1 设计稿 · iOS 风 · 工作台</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   iOS 风 · 工作台
   这一页最能体现 iOS 语的"分组列表"（inset grouped list）：
   每一项不是磁贴、不是行式条目，而是**一张卡片里的一行**，
   行与行之间有内嵌细线、右侧有 chevron。
   ═══════════════════════════════════════════════════════════════ */
:root {
  color-scheme: dark;
  --bg: #f2f2f7; --card: #ffffff; --card-2: #f2f2f7;
  --fill: #78788014; --fill-2: #78788028;
  --sep: #3c3c431f; --sep-strong: #3c3c4338;
  --t1: #000000; --t2: #3c3c4399; --t3: #3c3c434d; --t4: #3c3c432e;
  --blue: #007aff; --blue-hi: #0a6fd6;
  --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de;
  --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-xl: 18px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  --shadow-card: 0 0 0 0.5px rgba(0,0,0,.04);
  --shadow-pop: 0 10px 40px rgba(0,0,0,.14);
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --bg: #000000; --card: #1c1c1e; --card-2: #2c2c2e;
  --fill: #7878805c; --fill-2: #7878807a;
  --sep: #54545899; --sep-strong: #545458a0;
  --t1: #ffffff; --t2: #ebebf599; --t3: #ebebf54d; --t4: #ebebf52e;
  --blue: #0a84ff; --blue-hi: #409cff;
  --green: #30d158; --red: #ff453a; --orange: #ff9f0a; --purple: #bf5af2;
  --shadow-card: none;
  --shadow-pop: 0 10px 40px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--t1);
  font-size: 13.5px; line-height: 1.47; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100vh; }

.side {
  background: var(--card); display: flex; flex-direction: column;
  min-height: 0; padding: 0 0 8px;
  border-right: 0.5px solid var(--sep);
}
.side-head { padding: 18px 16px 10px; display: flex; align-items: center; gap: 9px; }
.logo {
  width: 26px; height: 26px; border-radius: 7px; background: var(--t1);
  color: var(--card); display: grid; place-items: center;
  font-size: 13px; font-weight: 600; flex: 0 0 auto;
}
.side-head .name { font-size: 14px; font-weight: 600; }
.side-head .ver { margin-left: auto; font-size: 10.5px; color: var(--t3); }

.nav { padding: 0 10px; }
.nav-item {
  display: flex; align-items: center; gap: 9px;
  height: 34px; padding: 0 11px; border-radius: 9px;
  border: 0; background: none; color: var(--t1);
  font: inherit; font-size: 13.5px; cursor: pointer;
  width: 100%; text-align: left; transition: background-color .12s ease;
}
.nav-item:hover { background: var(--fill); }
.nav-item.on { background: var(--blue); color: #fff; }
.nav-item.on .ico { color: #fff; }
.nav-item.on .badge { color: rgba(255,255,255,.75); }
.nav-item .ico {
  width: 17px; height: 17px; flex: 0 0 auto; color: var(--t2);
  display: grid; place-items: center;
}
.nav-item .ico svg { width: 16px; height: 16px; }
.nav-item .badge { margin-left: auto; font-size: 11px; color: var(--t3); }
.nav-label {
  padding: 14px 18px 5px; font-size: 11px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase; color: var(--t3);
  user-select: none;
}
.side-foot { margin-top: auto; padding: 8px; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

.topbar { flex: 0 0 auto; padding: 16px 24px 12px; }
.topbar .row1 { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
.topbar h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.022em; }
.topbar .sub { font-size: 12px; color: var(--t2); }
.topbar .gap { flex: 1; }
.cbtn {
  width: 30px; height: 30px; border-radius: 50%; border: 0;
  background: var(--fill); color: var(--blue);
  display: grid; place-items: center; cursor: pointer;
  transition: background-color .12s ease;
}
.cbtn:hover { background: var(--fill-2); }
.cbtn svg { width: 15px; height: 15px; }

.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 24px 24px; }
.inner { max-width: 720px; }

.group { margin-bottom: 22px; }
.group-title {
  padding: 0 4px 7px; font-size: 11.5px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--t3); user-select: none;
}

.card {
  background: var(--card); border-radius: var(--r-lg);
  box-shadow: var(--shadow-card); overflow: hidden;
}

/* ── 分组行：这是 iOS 的核心语汇 ──
   iOS 的图标是"彩色圆角方块"，不是线框。这是它跟 Linear 最大的视觉差异：
   Linear 把颜色压到几乎没有，iOS 用彩色小方块做**识别锚点**。 */
.row {
  display: flex; align-items: center; gap: 11px;
  min-height: 44px; padding: 6px 14px;
  cursor: pointer; position: relative;
  transition: background-color .1s ease;
}
.row:hover { background: var(--fill); }
.row + .row::before {
  content: ""; position: absolute; top: 0; left: 58px; right: 0;
  height: 0.5px; background: var(--sep);
}
/* 这行的分隔线从图标右边开始 —— iOS 的标准做法 */
.row.no-icon + .no-icon::before,
.card > .row:first-child + .row::before { left: 58px; }

/* 彩色圆角方块图标（iOS Settings 的做法） */
.app-ico {
  width: 29px; height: 29px; border-radius: 7px;
  display: grid; place-items: center;
  color: #fff; flex: 0 0 auto;
  box-shadow: inset 0 -0.5px 0 rgba(0,0,0,.08);
}
.app-ico svg { width: 16px; height: 16px; }
.app-ico.b1 { background: linear-gradient(180deg, #4a9eff, #007aff); }
.app-ico.b2 { background: linear-gradient(180deg, #30d158, #28a745); }
.app-ico.b3 { background: linear-gradient(180deg, #ff9f0a, #ff9500); }
.app-ico.b4 { background: linear-gradient(180deg, #bf5af2, #af52de); }
.app-ico.b5 { background: linear-gradient(180deg, #8e8e93, #636366); }
.app-ico.b6 { background: linear-gradient(180deg, #64d2ff, #0a84ff); }

/* <span> 是行内元素 —— 不给 display:block，名称和描述会挤成一行。
   这是这套设计稿里第二次踩同一个坑（工作台行式条目也踩过）。 */
.row-main { flex: 1; min-width: 0; display: block; }
.row-name {
  display: block;
  font-size: 13.5px; font-weight: 500; color: var(--t1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row-desc {
  display: block;
  font-size: 12px; color: var(--t2); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* 右侧数值：iOS 用灰色数字，不加标签 */
.row-val {
  font-size: 13px; color: var(--t3); flex: 0 0 auto;
  font-variant-numeric: tabular-nums;
}
.chev { color: var(--t3); display: grid; place-items: center; flex: 0 0 auto; }
.chev svg { width: 12px; height: 12px; }

/* 危险项（iOS 的红字） */
.row.danger .row-name { color: var(--red); }

/* 说明卡（iOS 常见的"页脚说明"）
   不要用负 margin 去贴卡片 —— 卡片有 overflow:hidden，负边距会把文字吸进去。
   正间距 + 上面少一点、下面多一点，就得到了 iOS 那种"紧贴"的观感。 */
.footnote {
  padding: 7px 4px 0;
  font-size: 12px; line-height: 1.5; color: var(--t3);
}
.footnote + .group, .footnote ~ .group { margin-top: 0; }

/* 顶部卡片：欢迎区（iOS 的 grouped header 可以放一句说明） */
.hero {
  background: var(--card); border-radius: var(--r-lg);
  box-shadow: var(--shadow-card); padding: 18px 20px; margin-bottom: 22px;
  display: flex; align-items: center; gap: 14px;
}
.hero .big {
  width: 44px; height: 44px; border-radius: 11px;
  background: var(--t1); color: var(--card);
  display: grid; place-items: center;
  font-size: 19px; font-weight: 600; flex: 0 0 auto;
}
.hero h2 { margin: 0 0 3px; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.hero p { margin: 0; font-size: 12.5px; color: var(--t2); line-height: 1.5; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: transparent; border-radius: 4px;
  border: 2px solid transparent; background-clip: content-box;
}
*:hover::-webkit-scrollbar-thumb { background: var(--t4); background-clip: content-box; }

.theme-toggle {
  position: fixed; left: 16px; bottom: 14px; z-index: 99;
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 11px; border-radius: 999px; border: 0;
  background: var(--fill-2); color: var(--t2);
  font: inherit; font-size: 11.5px; cursor: pointer;
  backdrop-filter: blur(20px);
  transition: background-color .12s;
}
.theme-toggle:hover { color: var(--t1); }
.theme-toggle svg { width: 13px; height: 13px; }
</style>
</head>
<body>
<div class="app">

<button class="theme-toggle" id="tt">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
    <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.6 6.6 0 0 0 10.7 10.7z"/>
  </svg>
  <span id="ttLabel">深色</span>
</button>
<script>
(function () {
  var k = 'bandi.design.ios.theme';
  var cur = 'light';
  try { cur = localStorage.getItem(k) || 'light'; } catch (e) {}
  var btn = document.getElementById('tt');
  var lab = document.getElementById('ttLabel');
  function apply(t) {
    document.documentElement.setAttribute('data-theme', t);
    lab.textContent = t === 'dark' ? '浅色' : '深色';
    try { localStorage.setItem(k, t); } catch (e) {}
  }
  apply(cur);
  btn.addEventListener('click', function () {
    apply(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
